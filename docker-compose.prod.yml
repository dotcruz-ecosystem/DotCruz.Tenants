services:
  workspaces-api:
    image: ${DOCKER_IMAGE_TAG}
    container_name: dotcruz-workspaces-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:5052:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${WORKSPACES_CONNECTION_STRING}
      - CoreAuth__BaseAddress=${CORE_AUTH_BASE_ADDRESS}
      - Settings__Jwt__Issuer=${JWT_ISSUER}
      - Settings__Jwt__Audience=${JWT_AUDIENCE}
      - Settings__Jwt__JwksUrl=${JWT_JWKS_URL}
      - Settings__ServiceAuth__Self__Name=Workspaces
      - Settings__ServiceAuth__Self__Key=${WORKSPACES_SERVICE_KEY}
      - Settings__ServiceAuth__Keys__CoreAuth=${COREAUTH_SERVICE_KEY}
      - Settings__ServiceAuth__Keys__Notifications=${NOTIFICATIONS_SERVICE_KEY}
      - Settings__ServiceAuth__Keys__Garage=${GARAGE_SERVICE_KEY}
      - Settings__AWS__Region=${AWS_REGION}
      - Settings__AWS__AccessKey=${AWS_ACCESS_KEY_ID_VPS}
      - Settings__AWS__SecretKey=${AWS_SECRET_ACCESS_KEY_VPS}
      - Settings__AWS__SmtpParameterPath=${AWS_SMTP_PARAMETER_PATH}
      - Settings__WorkspaceMessaging__Host=${RABBITMQ_HOST:-dotcruz-rabbitmq}
      - Settings__WorkspaceMessaging__Port=${RABBITMQ_PORT:-5672}
      - Settings__WorkspaceMessaging__Username=${RABBITMQ_USER:-dotcruz}
      - Settings__WorkspaceMessaging__Password=${RABBITMQ_PASS:-mudar123}
    networks:
      - dotcruz_net
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  dotcruz_net:
    name: dotcruz_net
    external: true
